defaults:

  logdir: null
  traindir: null
  evaldir: null
  offline_traindir: ''
  offline_evaldir: ''
  seed: 0
  deterministic_run: False
  steps: 1e6
  parallel: False
  eval_every: 1e4
  eval_episode_num: 10
  log_every: 1e4
  reset_every: 0
  device: 'cuda:0'
  compile: True
  precision: 32
  debug: False
  video_pred_log: True

  # Environment
  task: 'dmc_walker_walk'
  size: [64, 64]
  envs: 1
  action_repeat: 2
  time_limit: 1000
  grayscale: False
  prefill: 2500
  reward_EMA: True

  # Model
  dyn_hidden: 512
  dyn_deter: 512
  dyn_stoch: 32
  dyn_discrete: 32
  dyn_rec_depth: 1
  dyn_mean_act: 'none'
  dyn_std_act: 'sigmoid2'
  dyn_min_std: 0.1
  grad_heads: ['decoder', 'reward', 'cont']
  units: 512
  act: 'SiLU'
  norm: True
  encoder:
    {mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, symlog_inputs: True}
  decoder:
    {mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse, outscale: 1.0}
  actor:
    {layers: 2, dist: 'normal', entropy: 3e-4, unimix_ratio: 0.01, std: 'learned', min_std: 0.1, max_std: 1.0, temp: 0.1, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 1.0}
  critic:
    {layers: 2, dist: 'symlog_disc', slow_target: True, slow_target_update: 1, slow_target_fraction: 0.02, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 0.0}
  reward_head:
    {layers: 2, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  cont_head:
    {layers: 2, loss_scale: 1.0, outscale: 1.0}
  dyn_scale: 0.5
  rep_scale: 0.1
  kl_free: 1.0
  weight_decay: 0.0
  unimix_ratio: 0.01
  initial: 'learned'

  # Training
  batch_size: 16
  batch_length: 64
  train_ratio: 512
  pretrain: 100
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 1000
  dataset_size: 1000000
  opt: 'adam'

  # Behavior.
  discount: 0.997
  discount_lambda: 0.95
  imag_horizon: 15
  imag_gradient: 'dynamics'
  imag_gradient_mix: 0.0
  eval_state_mean: False

  # Exploration
  expl_behavior: 'greedy'
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'stoch'
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False

dmc_proprio:
  steps: 5e5
  action_repeat: 2
  envs: 4
  train_ratio: 512
  video_pred_log: false
  encoder: {mlp_keys: '.*', cnn_keys: '$^'}
  decoder: {mlp_keys: '.*', cnn_keys: '$^'}

dmc_vision:
  steps: 1e6
  action_repeat: 2
  envs: 4
  train_ratio: 512
  video_pred_log: true
  encoder: {mlp_keys: '$^', cnn_keys: 'image'}
  decoder: {mlp_keys: '$^', cnn_keys: 'image'}

crafter:
  task: crafter_reward
  step: 1e6
  action_repeat: 1
  envs: 1
  train_ratio: 512
  video_pred_log: true
  dyn_hidden: 1024
  dyn_deter: 4096
  units: 1024
  encoder: {mlp_keys: '$^', cnn_keys: 'image', cnn_depth: 96, mlp_layers: 5, mlp_units: 1024}
  decoder: {mlp_keys: '$^', cnn_keys: 'image', cnn_depth: 96, mlp_layers: 5, mlp_units: 1024}
  actor: {layers: 5, dist: 'onehot', std: 'none'}
  value: {layers: 5}
  reward_head: {layers: 5}
  cont_head: {layers: 5}
  imag_gradient: 'reinforce'

atari100k:
  steps: 4e5
  envs: 1
  action_repeat: 4
  train_ratio: 1024
  video_pred_log: true
  eval_episode_num: 100
  actor: {dist: 'onehot', std: 'none'}
  imag_gradient: 'reinforce'
  stickey: False
  lives: unused
  noops: 30
  resize: opencv
  actions: needed
  time_limit: 108000

minecraft:
  task: minecraft_diamond
  step: 1e8
  parallel: True
  envs: 16
  # no eval
  eval_episode_num: 0
  eval_every: 1e4
  action_repeat: 1
  train_ratio: 16
  video_pred_log: true
  dyn_hidden: 1024
  dyn_deter: 4096
  units: 1024
  encoder: {mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath|obs_reward', cnn_keys: 'image', cnn_depth: 96, mlp_layers: 5, mlp_units: 1024}
  decoder: {mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath', cnn_keys: 'image', cnn_depth: 96, mlp_layers: 5, mlp_units: 1024}
  actor: {layers: 5, dist: 'onehot', std: 'none'}
  value: {layers: 5}
  reward_head: {layers: 5}
  cont_head: {layers: 5}
  imag_gradient: 'reinforce'
  break_speed: 100.0
  time_limit: 36000

memorymaze:
  steps: 1e8
  action_repeat: 2
  actor: {dist: 'onehot', std: 'none'}
  imag_gradient: 'reinforce'
  task: 'memorymaze_9x9'

# [CoDreamer] 多智能体配置：Sequential Estimate Game（论文附录 B）
#
# 与 dmc_proprio 的差别：
#   - task 前缀 'seg' 让 dreamer.py:make_env 走我们的队伍级环境分支
#   - envs 是【**队伍数**】，不是 agent 数；每队内部有 Spec.num_agents 个 agent
#   - action_repeat=1（本环境无帧堆叠概念），episode 长度由环境自己管（Spec.horizon）
#
# 关于 train_ratio：配置里保持论文值 512。多智能体下 _step 每队伍步增加
# num_agents，会使调度频繁 num_agents*action_repeat 倍，因此 dreamer.py 会在
# 启动时自动补偿（此处 512 -> 512/(4*1) = 128）并在日志里打印。
# 详见 tools_marl.py 模块 docstring 的推导。
codreamer:
  task: 'seg_seq'
  envs: 1
  action_repeat: 1
  steps: 1e5
  prefill: 1000
  # 论文 D.3："500 training steps of the world model before any behaviour
  # is learnt"。上游默认 100，且语义不同（那个 100 里策略也在训）。
  # 我们已经给 _train 加了 update_behavior 分支，这里的 500 才是论文说的那个。
  pretrain: 500
  train_ratio: 512
  eval_every: 5e3
  eval_episode_num: 8
  log_every: 2e3
  video_pred_log: false
  # 离散动作：actor 用 onehot 分布（同 atari/crafter/memorymaze 的写法）
  actor: {dist: 'onehot', std: 'none'}
  # encoder / decoder 的 key 选择用正则。
  # `^(?!adjacency$)(?!edge_features$).*` 读作"除这两个之外的全部 key"：
  # 图结构（邻接矩阵行 / 边特征行）要声明在 observation_space 里，但**绝不能**
  # 被当成特征编码或重建 —— 它们是给 GNN 用的拓扑，走的是旁路，不进 encoder。
  # 排除后 Encoder MLP shapes 里只应看到 state，启动日志可直接核对。
  encoder: {mlp_keys: '^(?!adjacency$)(?!edge_features$).*', cnn_keys: '$^'}
  decoder: {mlp_keys: '^(?!adjacency$)(?!edge_features$).*', cnn_keys: '$^'}

  # batch_size 的单位是【队伍数（图数）】，不是序列数 —— 见 tools_marl.make_graph_dataset。
  # 论文 Table 5 给 B=16，但那是按每队 1 个 agent 算的规模；我们有 N=4，16 队会变成
  # 64 条序列 / 4096 个 (序列,时刻) 节点。RTX 3060 12GB 实测：12 队可行，16 队 OOM。
  # 取 8 队（= 32 条序列 / 2048 节点）留出裕量。
  # ⚠️ 改这个值必须同时作用于 IDreamer 和 CoDreamer，否则两条曲线不可比。
  batch_size: 8

  # --- GNN（CoDreamer 与 IDreamer 的唯一区别）----------------------------------
  # 论文 Table 2：RSSM GNN Layers = 1，Reward & Cont GNN Layers = 1
  # 论文 Table 3：Actor-Critic GNN Layers = 1
  #
  # ★ 单一开关 ★  CoDreamer 与 IDreamer 的差别散布在**三处**独立的 GNN 上，
  # 用三个开关分别控制极易跑出"半个 CoDreamer"（README 就曾经把它写成
  # "唯一开关"，是错的）。所以日常实验只改这一个键：
  #     --comm_variant idreamer   三处全 0（严格恒等）
  #     --comm_variant codreamer  三处全 1（论文 Table 2/3）
  # 下面三个键的默认值 -1 = "跟随 comm_variant"；显式给非负值可以覆盖它做消融。
  # main() 在建模型之前展开它们，并把展开后的值写进 checkpoint。
  comm_variant: 'idreamer'
  gnn_layers: -1           # RSSM 里插几层（论文 1）
  gnn_heads: 1             # GATv2 的注意力头数（论文未给，取 1）
  gnn_head_layers: -1      # reward / cont 预测头里插几层（论文 1）
                           # 位置：作用在头的 512 维隐层上，而不是 1536 维的输入上
                           # （5·d² 在 1536 维是 1180 万参数，不可能）。
                           # decoder 头**永远不插**（论文明确要求）。
  gnn_behavior_layers: -1  # actor / critic 里插几层（论文 Table 3：GNN Layers 1）
                           # 想象阶段用**冻结的起点图**（论文要求，不重新预测）
                           # 执行阶段也必须带图 —— 见 Dreamer._policy

  # --- Phase 2：环境切断（想象辅助训练）-----------------------------------------
  # 前 imagination_after_frac 比例的训练正常（环境供数据）；之后**彻底切断环境**，
  # 策略只能靠世界模型的想象轨迹继续提升。
  #
  # 验收的硬证据：切断后 metrics.jsonl 里的 dataset_size 必须一直不变，
  # 且 dataset_size_drift 恒为 0。任何变化都说明环境没收干净。
  imagination_only: false
  imagination_after_frac: 0.5
  # 切断后世界模型是否冻结（变体 A/B）：
  #   true  —— 冻结 WM，只训策略 → 测"这个 WM 够不够好"
  #   false —— WM 继续在**冻结的 replay** 上训练（仍不接触环境）→ 更宽松的设定
  imagination_freeze_world_model: false

  # --- Sequential Estimate Game 的环境规格（默认值 = 论文 Table 1）-------------
  # 这几个键的意义是做横向对比实验：找出"通信真正有用"的配置区间。
  # 所有键都会自动变成命令行参数，例如 --seg_obs_mode oracle。
  seg_num_agents: 4           # n
  seg_horizon: 5              # T
  seg_num_actions: 4          # |A|，间接决定容差 1/(2|A|)
  seg_edge_density: 0.6       # rho
  seg_local_state_ratio: 0.3  # eta，越小越依赖邻居
  seg_target_transform: 'identity'   # identity | stretch（论文原式）
  seg_obs_mode: 'local'       # local | oracle（给全部 agent 状态，用于算上界）
  # 是否让环境吐出图拓扑（邻接矩阵 + 边特征）。IDreamer 时关掉；CoDreamer 需要它。
  # 开启后 observation_space 多出 "adjacency" 和 "edge_features" 两个 key。
  seg_graph_obs: false

  # --- VMAS（论文正文主实验；task 用 --task vmas_flocking 之类指定）--------------
  # 场景参数（agent 数、目标数、障碍数）取自论文 Table 8/9/10，写死在
  # envs/vmas_env.py 的 TASKS 里；这里只暴露需要调的东西。
  vmas_max_steps: 500          # 论文 Table 8 的 Avg. Time Horizon
  # 通信半径 C。论文只说“边当且仅当 ||p_i - p_j|| <= C，C 由环境设定”，
  # 但 VMAS 没有这个概念，论文也没给三个任务的值 —— 所以 C 是我们选的。
  # <= 0 = 用任务默认（flocking/discovery 1.5，buzz_wire 0.5）。
  # 默认值的选法：先量互距分布，再取一个让图既不空也不满的值。
  # 详见 envs/vmas_env.py 的模块 docstring。
  vmas_comm_radius: -1.0
  vmas_graph_obs: true
  vmas_add_agent_index: true   # 论文对 IDreamer 的明确要求（非视觉环境拼 one-hot）
  vmas_device: 'cpu'           # VMAS 物理仿真放 CPU，策略仍在 GPU

  # --- held-out 开环预测误差（世界模型"想得准不准"的口径）------------------------
  # 每隔一次评测，用 evaldir 里的 held-out 局算多步开环误差并写进日志：
  # posterior 吃完序列后，**只喂真实动作、不再看观测**，让 prior 往前走。
  #
  # 为什么不能用 replay 的 reward_loss / state_loss 代替：那是训练损失，且用的是
  # **看过当步观测的 posterior** —— 它衡量重建，不衡量预测。见 models.openloop_error。
  #
  # 格式：空格分隔的 horizon 列表（空字符串 = 关闭）。
  # 必须 <= batch_length - 2（默认 batch_length=64）。
  openloop_horizons: '1 4 16'

debug:
  debug: True
  pretrain: 1
  prefill: 1
  batch_size: 10
  batch_length: 20
